name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - run: |
          curl -L -o www/three.min.js https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js
          sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js#three.min.js#' www/index.html
      - run: npm install
      - run: npx cap add android && npx cap sync android
      - run: sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml
      - run: keytool -genkeypair -keystore $GITHUB_WORKSPACE/release.jks -alias mykey -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=DesertStrike"
      - working-directory: android
        run: >
          ./gradlew assembleRelease
          -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/release.jks
          -Pandroid.injected.signing.store.password=123456
          -Pandroid.injected.signing.key.alias=mykey
          -Pandroid.injected.signing.key.password=123456
      - uses: actions/upload-artifact@v4
        with:
          name: desert-strike-apk
          path: android/app/build/outputs/apk/release/*.apk
